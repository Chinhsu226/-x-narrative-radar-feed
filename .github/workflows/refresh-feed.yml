name: Refresh Narrative Radar Feed

on:
  schedule:
    # 北京时间每日 9:00 (= 01:00 UTC)。早于本地 cron 10:00 一小时
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ddgs

      - name: Run refresh
        run: python3 scripts/refresh.py

      - name: Commit updated feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain feed-radar.json)" ]; then
            git add feed-radar.json
            git commit -m "refresh feed $(date -u +%Y-%m-%d_%H:%M)"
            git push
          else
            echo "no changes to feed; skipping commit"
          fi
